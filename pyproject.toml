[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memdlm*"]

[project]
name = "memdlm"
version = "0.1.0"
description = "MemDLM: Memory-Enhanced Diffusion Language Model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers==4.57.0",
    "accelerate==1.11.0",
    "deepspeed==0.18.0",
    "peft==0.17.1",
    "datasets==4.2.0",
    "sentencepiece==0.2.0",
    "tensorboard",
    "torchmetrics",
    "tyro",
    "wandb",
    "omegaconf",
    "tqdm",
    "matplotlib",
    "pytest",
    "rich",
]

[project.optional-dependencies]
optional = [
    "bitsandbytes==0.48.1",
    "vllm==0.8.5.post1",
    "flash-attn==2.8.3",
]
rl = [
    "trl==0.26.0",
    "math_verify==0.8.0",
]

[tool.black]
line-length = 88
exclude = '''
(
    (^|/)dllm(/|$)|
    (^|/)lm-evaluation-harness(/|$)|
    (^|/)memdlm/pipelines/llada21/models(/|$)
)
'''

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
python_files = ["test_*.py"]
addopts = "-v -ra"
